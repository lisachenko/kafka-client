// JAAS configuration of the test node: SASL/PLAIN users for the SASL_PLAINTEXT / SASL_SSL listeners.
// Test credentials only - do not use anywhere else. `acltest` is the one user that start.sh does not list in
// `super.users`, so that the ACL apis have a principal whose access the StandardAuthorizer really decides.
KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret"
    user_admin="admin-secret"
    user_kafkatest="kafkatest-secret"
    user_acltest="acltest-secret";
};
