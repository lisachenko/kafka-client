# Single-node Apache Kafka 3.9.2 (KRaft, broker and controller in one process) used by the integration test suite.
#
#   docker compose up -d
#   KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092 vendor/bin/phpunit --testsuite integration
#
services:
    kafka:
        build:
            context: ./docker/kafka-3.9.2
        container_name: kafka-3-9-2
        environment:
            ADVERTISED_HOST: 127.0.0.1
            ADVERTISED_PORT: 9092
            NODE_ID: 1
            NUM_PARTITIONS: 3
        # Every partition costs the broker a few file descriptors and the container inherits the daemon's limit
        # (20000 in the Claude Code sandbox, which refuses a higher `ulimits: nofile`): a session that leaves its
        # test topics behind takes the second log directory offline with "Too many open files". The tests delete
        # the topics they create, and the coordinator recreates the container between milestones.
        ports:
            - "9092:9092"
            - "9093:9093"
            - "9094:9094"
            - "9095:9095"
        healthcheck:
            # This only reports that the node accepts connections. It is deliberately not a readiness check: a
            # KRaft node answers Metadata with its own broker before any topic exists, but a fresh topic still
            # answers 5/6 for a moment, and the lines below had brokers that answered an EMPTY broker array until
            # the controller had pushed UpdateMetadata. Readiness is therefore a client-side concern - see
            # tests/Fixture/ClusterReadinessProbe.php and the "Cluster readiness" section of docs/protocol/3.9.md.
            test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'"]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 5s
