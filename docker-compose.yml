# Single-node Apache Kafka 0.8.2.2 used by the integration test suite.
#
#   docker compose up -d
#   KAFKA_BOOTSTRAP_SERVERS=127.0.0.1:9092 vendor/bin/phpunit --testsuite integration
#
services:
    kafka:
        build:
            context: ./docker/kafka-0.8.2.2
        container_name: kafka-0-8-2-2
        environment:
            ADVERTISED_HOST: 127.0.0.1
            ADVERTISED_PORT: 9092
            BROKER_ID: 0
            NUM_PARTITIONS: 3
        ports:
            - "9092:9092"
            - "2181:2181"
        healthcheck:
            # The broker port accepting TCP is not enough: ZooKeeper must serve the broker registration as well.
            # Even then a 0.8 broker answers Metadata with an empty broker array until the controller has pushed
            # UpdateMetadata to it, so clients still have to retry - see tests/Fixture/ClusterReadinessProbe.php.
            test:
                - CMD-SHELL
                - bash -c '</dev/tcp/127.0.0.1/9092' && /opt/kafka/bin/kafka-topics.sh --zookeeper localhost:2181 --list > /dev/null 2>&1
            interval: 5s
            timeout: 20s
            retries: 30
            start_period: 10s
